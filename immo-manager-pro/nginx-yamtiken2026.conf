# ─── Redirection HTTP → HTTPS ───────────────────────────────────────
server {
    listen 80;
    server_name yamtiken2026.online www.yamtiken2026.online;
    return 301 https://www.yamtiken2026.online$request_uri;
}

# ─── HTTPS principal ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name yamtiken2026.online www.yamtiken2026.online;

    # SSL — généré par : certbot --nginx -d yamtiken2026.online -d www.yamtiken2026.online
    ssl_certificate     /etc/letsencrypt/live/yamtiken2026.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yamtiken2026.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/immo-manager-pro/client/dist;
    index index.html;

    # Taille max upload
    client_max_body_size 15M;

    # ── Frontend React SPA ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Cache fichiers statiques compilés (JS/CSS/images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy API → Backend Node.js ─────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts (augmentés pour les gros exports PDF/Excel)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # CORS (www + non-www)
        set $cors_origin "";
        if ($http_origin ~* "^https://(www\.)?yamtiken2026\.online$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  $cors_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Content-Length 0;
            return 204;
        }
    }

    # ── Fichiers uploadés ───────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Logs
    access_log /var/log/nginx/yamtiken2026.online-access.log;
    error_log  /var/log/nginx/yamtiken2026.online-error.log;
}
