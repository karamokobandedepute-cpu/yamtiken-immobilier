version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: yamtiken-backend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - yamtiken-uploads:/app/uploads
      - yamtiken-logs:/app/logs
    networks:
      - yamtiken-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    container_name: yamtiken-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yamtiken-network

volumes:
  yamtiken-uploads:
  yamtiken-logs:

networks:
  yamtiken-network:
    driver: bridge
