# ============================================================
# DOCKER COMPOSE - INFRASTRUCTURE INCREVABLE
# Backend + Frontend avec restart always et health checks
# ============================================================
version: '3.8'

services:
  # ============================================================
  # BACKEND NODE.JS - L'API
  # ============================================================
  backend:
    build:
      context: ./immo-manager-pro/server
      dockerfile: Dockerfile
    container_name: immo-backend

    expose:
      - "5002"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.backend-http.entrypoints=http"
      - "traefik.http.routers.backend-http.rule=(Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-https.entrypoints=https"
      - "traefik.http.routers.backend-https.rule=(Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-https.tls=true"
      - "traefik.http.routers.backend-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=5002"

    restart: always

    volumes:
      - backend_logs:/app/logs

    environment:
      - NODE_ENV=production
      - PORT=5002
      # ⚠️ Variables critiques SANS fallback — COOLIFY EST LA SOURCE UNIQUE DE VÉRITÉ
      # (ça permet de supprimer/modifier les vars depuis l'UI Coolify sans blocage)
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN}
      # Valeurs par défaut acceptables (non-secrets)
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-100y}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-munokolive@gmail.com}
      - ALERT_EMAIL=${ALERT_EMAIL:-munokolive@gmail.com}
      - ALERT_REFRESH_INTERVAL=${ALERT_REFRESH_INTERVAL:-5}
      - CLIENT_URL=${CLIENT_URL:-https://yamtiken2026.online}
    
    # Ã°Å¸â€™Â¾ LIMITES MÃƒâ€°MOIRE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    
    # Ã°Å¸ÂÂ¥ HEALTH CHECK - VÃƒÂ©rifie si le service rÃƒÂ©pond
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5002/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Ã°Å¸Å’Â RÃƒâ€°SEAU
    networks:
      - default
      - coolify
    
    # Ã°Å¸â€œÂ LOGS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # FRONTEND VITE - L'INTERFACE
  # ============================================================
  frontend:
    build:
      context: ./immo-manager-pro/client
      dockerfile: Dockerfile
      args:
        # ⚠️ Supabase keys SANS fallback — COOLIFY BUILD ARGS SONT LA SOURCE UNIQUE
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: immo-frontend

    expose:
      - "80"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.frontend-http.entrypoints=http"
      - "traefik.http.routers.frontend-http.rule=Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)"
      - "traefik.http.routers.frontend-https.entrypoints=https"
      - "traefik.http.routers.frontend-https.rule=Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)"
      - "traefik.http.routers.frontend-https.tls=true"
      - "traefik.http.routers.frontend-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

    restart: always

    volumes:
      - frontend_logs:/app/logs

    environment:
      - NODE_ENV=production
      # Note: les VITE_* d'environnement runtime SONT IGNORÉS car Vite les injecte au BUILD
      # On les garde juste pour référence.
      - VITE_API_URL=${VITE_API_URL:-/api}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    
    # Ã°Å¸â€™Â¾ LIMITES MÃƒâ€°MOIRE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    
    # Ã°Å¸ÂÂ¥ HEALTH CHECK
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Ã¢ÂÂ³ DÃƒâ€°PENDANCES (DÃƒÂ©marrage non-bloquant)
    depends_on:
      backend:
        condition: service_started
    
    # Ã°Å¸Å’Â RÃƒâ€°SEAU
    networks:
      - coolify
    
    # Ã°Å¸â€œÂ LOGS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================
# RÃƒâ€°SEAU INTERNE & EXTERNE (COOLIFY)
# ============================================================
networks:
  coolify:
    name: coolify
    external: true

# ============================================================
# VOLUMES PERSISTANTS
# ============================================================
volumes:
  backend_logs:
  frontend_logs:

