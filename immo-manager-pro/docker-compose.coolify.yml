# ============================================================
# DOCKER COMPOSE - INFRASTRUCTURE INCREVABLE
# Backend + Frontend avec restart always et health checks
# ============================================================
version: '3.8'

services:
  # ============================================================
  # BACKEND NODE.JS - L'API
  # ============================================================
  backend:
    build:
      context: ./immo-manager-pro/server
      dockerfile: Dockerfile
    container_name: immo-backend
    
    # 🔄 INCASSABLE - Toujours redémarrer
    restart: always
    
    # 🌐 PORTS
    ports:
      - "5002:5002"
    
    # 📁 VOLUMES - Logs uniquement en production
    volumes:
      - backend_logs:/app/logs
    
    # 🌍 ENVIRONNEMENT
    environment:
      - NODE_ENV=production
      - PORT=5002
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    
    # 💾 LIMITES MÉMOIRE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    
    # 🏥 HEALTH CHECK - Vérifie si le service répond
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5002/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # 🌐 RÉSEAU
    networks:
      - immo-network
    
    # 📝 LOGS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # FRONTEND VITE - L'INTERFACE
  # ============================================================
  frontend:
    build:
      context: ./immo-manager-pro/client
      dockerfile: Dockerfile
    container_name: immo-frontend
    
    # 🔄 INCASSABLE
    restart: always
    
    # 🌐 PORTS
    ports:
      - "5177:5177"
    
    # 📁 VOLUMES - Logs uniquement
    volumes:
      - frontend_logs:/app/logs
    
    # 🌍 ENVIRONNEMENT
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:5002/api
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    
    # 💾 LIMITES MÉMOIRE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    
    # 🏥 HEALTH CHECK
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5177"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # ⏳ DÉPENDANCES (Démarrage non-bloquant)
    depends_on:
      backend:
        condition: service_started
    
    # 🌐 RÉSEAU
    networks:
      - immo-network
    
    # 📝 LOGS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================
# RÉSEAU INTERNE
# ============================================================
networks:
  immo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================
# VOLUMES PERSISTANTS
# ============================================================
volumes:
  backend_logs:
  frontend_logs:
