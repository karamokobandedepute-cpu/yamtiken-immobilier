                                                     # ============================================================
# DOCKER COMPOSE - INFRASTRUCTURE INCREVABLE
# Backend + Frontend avec restart always et health checks
# ============================================================
version: '3.8'

services:
  # ============================================================
  # BACKEND NODE.JS - L'API
  # ============================================================
  backend:
    build:
      context: ./immo-manager-pro/server
      dockerfile: Dockerfile
    container_name: immo-backend
    
    # EXPOSE PORT
    expose:
      - "5002"
      
    # 🔄 INCASSABLE - Toujours redémarrer
    restart: always
    
    # 📁 VOLUMES - Logs uniquement en production
    volumes:
      - backend_logs:/app/logs
    
    # 🌍 ENVIRONNEMENT
    environment:
      - NODE_ENV=production
      - PORT=5002
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.ualdtjicekzyoobagfmf:77916407@@Mu@aws-0-eu-west-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=15&pool_timeout=30&sslmode=require&connect_timeout=30}
      - DIRECT_URL=${DIRECT_URL:-postgresql://postgres:77916407@@Mu@db.ualdtjicekzyoobagfmf.supabase.co:5432/postgres?sslmode=require}
      - JWT_SECRET=${JWT_SECRET:-yamtiken_behemoth_jwt_2026_secure_random_key_987654321abcdef}
      - SUPABASE_URL=${SUPABASE_URL:-https://ualdtjicekzyoobagfmf.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbGR0amljZWt6eW9vYmFnZm1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0OTU0NjAsImV4cCI6MjA5MzA3MTQ2MH0.db36vGw76szLp_wL8vUBn0-gVnJLV0k9zFnDKTj_DQc}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5177}
    
    # 💾 LIMITES MÉMOIRE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    
    # 🏥 HEALTH CHECK - Vérifie si le service répond
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5002/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # 🌐 RÉSEAU
    networks:
      - default
      - coolify
    
    # 📝 LOGS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # FRONTEND VITE - L'INTERFACE
  # ============================================================
  frontend:
    build:
      context: ./immo-manager-pro/client
      dockerfile: Dockerfile
    container_name: immo-frontend
    
    # EXPOSE PORT
    ports:
      - "80"
      
    # 🏷️ LABELS TRAEFIK
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.frontend.rule=Host(`yamtiken2026.online`)"
      - "traefik.http.routers.frontend.entrypoints=http,https"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      
    # 🔄 INCASSABLE
    restart: always
    
    # 📁 VOLUMES - Logs uniquement
    volumes:
      - frontend_logs:/app/logs
    
    # 🌍 ENVIRONNEMENT
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-/api}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://ualdtjicekzyoobagfmf.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbGR0amljZWt6eW9vYmFnZm1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0OTU0NjAsImV4cCI6MjA5MzA3MTQ2MH0.db36vGw76szLp_wL8vUBn0-gVnJLV0k9zFnDKTj_DQc}
    
    # 💾 LIMITES MÉMOIRE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    
    # 🏥 HEALTH CHECK
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # ⏳ DÉPENDANCES (Démarrage non-bloquant)
    depends_on:
      backend:
        condition: service_started
    
    # 🌐 RÉSEAU
    networks:
      - coolify
    
    # 📝 LOGS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================
# RÉSEAU INTERNE & EXTERNE (COOLIFY)
# ============================================================
networks:
  coolify:
    name: coolify
    external: true

# ============================================================
# VOLUMES PERSISTANTS
# ============================================================
volumes:
  backend_logs:
  frontend_logs:
