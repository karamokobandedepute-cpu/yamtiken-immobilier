# ============================================================
# DOCKER COMPOSE - INFRASTRUCTURE INCREVABLE
# Backend + Frontend avec restart always et health checks
# ============================================================
version: '3.8'

services:
  # ============================================================
  # BACKEND NODE.JS - L'API
  # ============================================================
  backend:
    build:
      context: ./immo-manager-pro/server
      dockerfile: Dockerfile
    container_name: immo-backend

    expose:
      - "5002"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.backend-http.entrypoints=http"
      - "traefik.http.routers.backend-http.rule=(Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-https.entrypoints=https"
      - "traefik.http.routers.backend-https.rule=(Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-https.tls=true"
      - "traefik.http.routers.backend-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=5002"

    restart: always

    volumes:
      - backend_logs:/app/logs

    environment:
      - NODE_ENV=production
      - PORT=5002
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.envdbpthrufwjvejbnal:77916407%40%40Mu@aws-0-eu-west-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=15&pool_timeout=30&sslmode=require&connect_timeout=30}
      - DIRECT_URL=${DIRECT_URL:-postgresql://postgres:77916407%40%40Mu@db.envdbpthrufwjvejbnal.supabase.co:5432/postgres?sslmode=require}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVudmRicHRocnVmd2p2ZWpibmFsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDkzMDQ0MSwiZXhwIjoyMTA2NTA2NDQxfQ.1TvtjdDHLnWpIX5RGdeEPR-e8tG6YhMFDeTY-qzRN20}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-munokolive@gmail.com}
      - ALERT_EMAIL=${ALERT_EMAIL:-munokolive@gmail.com}
      - ALERT_REFRESH_INTERVAL=${ALERT_REFRESH_INTERVAL:-5}
      - JWT_SECRET=${JWT_SECRET:-yamtiken_behemoth_jwt_2026_secure_random_key_987654321abcdef}
      - SUPABASE_URL=${SUPABASE_URL:-https://envdbpthrufwjvejbnal.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVudmRicHRocnVmd2p2ZWpibmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MzA0NDEsImV4cCI6MjEwNjUwNjQ0MX0.gUpb1Ixvuwa0ao1HVHNgtxFLKv74uhLmfvtZj5i4sdA}
      - CLIENT_URL=${CLIENT_URL:-https://yamtiken2026.online}
    
    # Ã°Å¸â€™Â¾ LIMITES MÃƒâ€°MOIRE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    
    # Ã°Å¸ÂÂ¥ HEALTH CHECK - VÃƒÂ©rifie si le service rÃƒÂ©pond
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5002/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Ã°Å¸Å’Â RÃƒâ€°SEAU
    networks:
      - default
      - coolify
    
    # Ã°Å¸â€œÂ LOGS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # FRONTEND VITE - L'INTERFACE
  # ============================================================
  frontend:
    build:
      context: ./immo-manager-pro/client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://envdbpthrufwjvejbnal.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVudmRicHRocnVmd2p2ZWpibmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MzA0NDEsImV4cCI6MjEwNjUwNjQ0MX0.gUpb1Ixvuwa0ao1HVHNgtxFLKv74uhLmfvtZj5i4sdA}
    container_name: immo-frontend

    expose:
      - "80"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.frontend-http.entrypoints=http"
      - "traefik.http.routers.frontend-http.rule=Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)"
      - "traefik.http.routers.frontend-https.entrypoints=https"
      - "traefik.http.routers.frontend-https.rule=Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)"
      - "traefik.http.routers.frontend-https.tls=true"
      - "traefik.http.routers.frontend-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

    restart: always

    volumes:
      - frontend_logs:/app/logs

    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-/api}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://envdbpthrufwjvejbnal.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVudmRicHRocnVmd2p2ZWpibmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MzA0NDEsImV4cCI6MjEwNjUwNjQ0MX0.gUpb1Ixvuwa0ao1HVHNgtxFLKv74uhLmfvtZj5i4sdA}
    
    # Ã°Å¸â€™Â¾ LIMITES MÃƒâ€°MOIRE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    
    # Ã°Å¸ÂÂ¥ HEALTH CHECK
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Ã¢ÂÂ³ DÃƒâ€°PENDANCES (DÃƒÂ©marrage non-bloquant)
    depends_on:
      backend:
        condition: service_started
    
    # Ã°Å¸Å’Â RÃƒâ€°SEAU
    networks:
      - coolify
    
    # Ã°Å¸â€œÂ LOGS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================
# RÃƒâ€°SEAU INTERNE & EXTERNE (COOLIFY)
# ============================================================
networks:
  coolify:
    name: coolify
    external: true

# ============================================================
# VOLUMES PERSISTANTS
# ============================================================
volumes:
  backend_logs:
  frontend_logs:

