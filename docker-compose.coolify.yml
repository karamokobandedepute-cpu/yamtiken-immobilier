# ============================================================
# DOCKER COMPOSE COOLIFY - À LA RACINE DU DÉPÔT
# Résolution des chemins : --project-directory = RACINE du dépôt
# Donc tous les contextes sont relatifs à la racine (./immo-manager-pro/...)
# ============================================================
version: '3.8'

services:
  # ============================================================
  # BACKEND NODE.JS / EXPRESS / PRISMA  -  API :5002
  # ============================================================
  backend:
    build:
      context: ./immo-manager-pro/server
      dockerfile: Dockerfile
    container_name: immo-backend

    expose:
      - "5002"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.backend-http.entrypoints=http"
      - "traefik.http.routers.backend-http.rule=(Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-https.entrypoints=https"
      - "traefik.http.routers.backend-https.rule=(Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-https.tls=true"
      - "traefik.http.routers.backend-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=5002"

    restart: always

    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads

    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5002}
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - ALERT_REFRESH_INTERVAL=${ALERT_REFRESH_INTERVAL}
      - CLIENT_URL=${CLIENT_URL}
      - VPS_FRONTEND_ORIGIN=${VPS_FRONTEND_ORIGIN}
      - VPS_API_ORIGIN=${VPS_API_ORIGIN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - CORS_ALLOW_ALL=${CORS_ALLOW_ALL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GMAIL_APP_EMAIL=${GMAIL_APP_EMAIL}
      - SERVICE_URL_BACKEND=${SERVICE_URL_BACKEND}
      - SERVICE_URL_FRONTEND=${SERVICE_URL_FRONTEND}
      - SERVICE_FQDN_BACKEND=${SERVICE_FQDN_BACKEND}
      - SERVICE_FQDN_FRONTEND=${SERVICE_FQDN_FRONTEND}

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'
        reservations:
          memory: 192M

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5002/api/health 2>/dev/null || curl -fsS http://127.0.0.1:5002/health 2>/dev/null || exit 1"]
      interval: 25s
      timeout: 6s
      retries: 5
      start_period: 35s

    networks:
      - default
      - coolify

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # FRONTEND VITE + REACT  -  Nginx sert dist/ :80
  # Proxy inverse /api → backend:5002  +  /uploads → backend:5002
  # ============================================================
  frontend:
    build:
      context: ./immo-manager-pro/client
      dockerfile: Dockerfile
      args:
        # Build Args pour Vite — injectés pendant le build (import.meta.env.VITE_*)
        VITE_API_URL: ${VITE_API_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        NODE_ENV: production
    container_name: immo-frontend

    expose:
      - "80"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.frontend-http.entrypoints=http"
      - "traefik.http.routers.frontend-http.rule=Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)"
      - "traefik.http.routers.frontend-https.entrypoints=https"
      - "traefik.http.routers.frontend-https.rule=Host(`yamtiken2026.online`) || Host(`www.yamtiken2026.online`)"
      - "traefik.http.routers.frontend-https.tls=true"
      - "traefik.http.routers.frontend-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

    restart: always

    volumes:
      - frontend_logs:/app/logs

    environment:
      - NODE_ENV=${NODE_ENV:-production}

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --spider http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 25s
      timeout: 5s
      retries: 5
      start_period: 25s

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - default
      - coolify

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================
# RÉSEAUX : coolify (externe, traefik) + default (interne compose)
# ============================================================
networks:
  coolify:
    name: coolify
    external: true
  default:
    driver: bridge

# ============================================================
# VOLUMES PERSISTANTS : logs + uploads backend (obligatoire multer)
# ============================================================
volumes:
  backend_logs:
  backend_uploads:
  frontend_logs:
